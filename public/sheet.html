<!DOCTYPE html>
<title>HammGrid</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f2b46">
<script src="/js/theme-boot.js"></script>
<body class="sheet-page">
  <div class="topbar" id="topbar"></div>
  <div class="app-shell">
    <div class="sidebar" id="sidebar"></div>
    <div class="shell-content" style="padding: 0;">
      <div class="sheet-tab-strip" id="sheet-tab-strip" style="display:none;"></div>
      <div class="sheet-view-row">
        <div class="sheet-canvas-area">
          <div class="zoom-wrap" id="zoom-wrap" style="height: calc(100vh - 53px); border-radius: 0;">
            <div class="version-badge" id="version-badge">
              <button type="button" id="sheet-nav-back-btn" title="Previous drawing (filtered/searched set)">&#9664;</button>
              <div class="version-badge-inner">
                <button type="button" id="version-badge-btn">Current &#9662;</button>
                <div class="version-dropdown" id="version-dropdown" style="display:none;"></div>
              </div>
              <button type="button" id="sheet-nav-forward-btn" title="Next drawing (filtered/searched set)">&#9654;</button>
            </div>
            <div class="stale-watermark" id="stale-watermark" style="display:none;">NOT CURRENT VERSION</div>
            <div class="zoom-pan-inner" id="zoom-pan-inner">
              <div class="markup-stage">
                <canvas id="pdf-canvas"></canvas>
                <svg id="sheet-link-svg" class="sheet-link-layer"></svg>
                <svg id="markup-svg"></svg>
              </div>
            </div>
            <div class="markup-popup" id="markup-popup" style="display:none;"></div>
            <div class="takeoff-crosshair-v" id="takeoff-crosshair-v" style="display:none;"></div>
            <div class="takeoff-crosshair-h" id="takeoff-crosshair-h" style="display:none;"></div>
          </div>
          <p class="muted" id="pdf-status" style="padding: 4px 12px;"></p>
        </div>
        <canvas id="magnifier-lens" class="magnifier-lens" style="display:none;"></canvas>

        <div class="sheet-pane" id="sheet-pane">
          <div class="pane-resize-handle" id="pane-resize-handle" title="Drag to resize"></div>
          <button class="pane-toggle" id="pane-toggle-btn" type="button">&#9656;</button>
          <div class="pane-body" id="pane-body">
            <div class="pane-section" id="section-markup">
              <button class="pane-section-header" type="button" data-section="markup">
                <span>Markup Tools</span>
                <span class="chevron">&#9662;</span>
              </button>
              <div class="pane-section-body">
                <div class="icon-tool-grid" id="tool-grid"></div>
                <div class="field"><label>Color</label><input type="color" id="markup-color" value="#e11d48"></div>
                <div class="field"><label>Line width</label><input type="number" id="markup-width" value="2" min="1" max="10"></div>
                <label id="publish-default-wrap" style="display:none;"><input type="checkbox" id="markup-publish-default"> Draw as published</label>
              </div>
            </div>

            <div class="pane-section" id="section-reference">
              <button class="pane-section-header" type="button" data-section="reference">
                <span>Reference</span>
                <span class="chevron">&#9662;</span>
              </button>
              <div class="pane-section-body">
                <div class="icon-tool-grid">
                  <button type="button" class="tool-btn tool-icon-btn" id="freeze-pane-tool-btn" title="Pin an area on screen (shortcut: P) - click, then drag a box around anything to keep visible while you pan/zoom. While overlaying, show only drawing A or only B first.">
                    <svg viewBox="0 0 20 20"><path d="M10 2a4 4 0 0 0-4 4c0 2.7 4 8.5 4 8.5s4-5.8 4-8.5a4 4 0 0 0-4-4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="10" cy="6" r="1.5" fill="currentColor"/></svg>
                  </button>
                </div>
              </div>
            </div>

            <div class="pane-section" id="section-measure">
              <button class="pane-section-header" type="button" data-section="measure">
                <span>Measure</span>
                <span class="chevron">&#9662;</span>
              </button>
              <div class="pane-section-body">
                <div class="field">
                  <label>Scale</label>
                  <div class="row" style="gap:6px;">
                    <select id="scale-select" style="flex:1;"></select>
                    <button type="button" id="scale-zones-manage-btn" class="icon-btn" title="Manage scale zones" style="display:none;">&#9881;</button>
                  </div>
                </div>
                <div class="icon-tool-grid" id="measure-tool-grid"></div>
                <div class="measure-result" id="measure-result" style="display:none;"></div>
                <button type="button" id="measure-clear-btn" style="width:100%;">Clear</button>
              </div>
            </div>

            <div class="pane-section" id="section-takeoffs" style="display:none;">
              <button class="pane-section-header" type="button" data-section="takeoffs">
                <span>Take-offs</span>
                <span class="chevron">&#9662;</span>
              </button>
              <div class="pane-section-body">
                <div class="icon-tool-grid" id="takeoff-tool-grid"></div>
                <div class="row" style="gap:6px;">
                  <button type="button" id="takeoff-from-template-btn" style="flex:1;">From Template...</button>
                  <button type="button" id="takeoff-from-existing-btn" style="flex:1;">From Existing...</button>
                </div>
                <button type="button" id="takeoff-from-assembly-btn" style="width:100%;">From Assembly...</button>
                <div class="takeoff-items-list" id="takeoff-assemblies-list"></div>
                <input type="text" id="takeoff-search" class="takeoff-search-input" placeholder="Search take-offs...">
                <button type="button" id="takeoff-hide-all-btn" class="takeoff-hide-all-btn" style="width:100%;">Hide all</button>
                <div class="takeoff-items-list" id="takeoff-items-list"></div>
              </div>
            </div>

            <div class="pane-section" id="section-composite" style="display:none;">
              <button class="pane-section-header" type="button" data-section="composite">
                <span>Composite Layout</span>
                <span class="chevron">&#9662;</span>
              </button>
              <div class="pane-section-body">
                <button type="button" id="composite-bring-in-btn" style="width:100%;">+ Bring in fragment...</button>
                <div class="fragment-list" id="fragment-list"></div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Item-actions group, box/brush point-select controls, and axis-lock/
       snap controls all share one bar (previously up to three separate/
       stacked bars) per explicit request - each part shows/hides
       independently depending on what's actually relevant (see
       updateTakeoffToolbar), but they all live in the same always-on-screen
       floating bar so there's only ever one place to look, nothing is ever
       hidden underneath another same-position bar, and nothing is ever
       off-screen on a short iPad viewport. -->
  <div id="takeoff-toolbar" class="selection-bar" style="display:none;">
    <div id="takeoff-item-actions-group" style="display:none; align-items:center; gap:6px;">
      <span class="takeoff-color-dot" id="takeoff-item-actions-dot"></span>
      <span class="takeoff-item-actions-name" id="takeoff-item-actions-name"></span>
      <span class="takeoff-item-actions-live-qty" id="takeoff-item-actions-live-qty"></span>
      <button type="button" id="takeoff-item-actions-stop">Stop</button>
      <button type="button" class="icon-btn" id="takeoff-item-actions-edit" title="Edit properties &amp; formula">&#9998;</button>
      <button type="button" class="icon-btn" id="takeoff-item-actions-remove" title="Remove from this sheet">&#8722;</button>
      <button type="button" class="icon-btn" id="takeoff-item-actions-delete" title="Delete from project">&#128465;</button>
    </div>
    <div id="takeoff-edit-select-group" style="display:none; align-items:center; gap:6px;">
      <div class="segmented" id="takeoff-select-mode">
        <button type="button" data-mode="box">Box select</button>
        <button type="button" data-mode="brush">Brush select</button>
      </div>
      <label class="chip-toggle" id="takeoff-brush-size-wrap" style="display:none;">
        <span>Size</span>
        <input type="range" id="takeoff-brush-size" min="15" max="100" value="40">
      </label>
      <button type="button" id="takeoff-edit-clear-selection">Clear selection</button>
    </div>
    <div class="segmented" id="takeoff-placement-mode">
      <button type="button" data-mode="points" class="active">Point-to-point</button>
      <button type="button" data-mode="box">Box</button>
    </div>
    <label class="chip-toggle" id="takeoff-axis-lock-chip">
      <input type="checkbox" id="takeoff-axis-lock-checkbox"><span class="dot"></span>Lock axes
    </label>
    <label class="chip-toggle" id="takeoff-snap-points-chip">
      <input type="checkbox" id="takeoff-snap-points-checkbox"><span class="dot"></span>Snap to points
    </label>
  </div>
  <div id="freeze-pane-toolbar" class="selection-bar" style="display:none;">
    <span>Drag a box around what you want to pin on screen</span>
    <button type="button" id="freeze-pane-cancel-btn">Cancel</button>
  </div>
  <script src="/js/api.js"></script>
  <script type="module" src="/js/sheet.js"></script>
  <script type="module" src="/js/pwa.js"></script>
</body>
